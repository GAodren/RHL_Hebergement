name: Build and Deploy

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: valofenua/package-lock.json

      - name: Install dependencies
        working-directory: valofenua
        run: npm ci

      - name: Build
        working-directory: valofenua
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: valofenua/dist
          publish_branch: deploy
          force_orphan: true

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy to Hostinger via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          cd valofenua/dist
          sshpass -p "$SFTP_PASSWORD" sftp -o StrictHostKeyChecking=no -P 65002 "$SFTP_USER@$SFTP_HOST" << EOF
          cd $SFTP_REMOTE_PATH
          put -r *
          bye
          EOF
